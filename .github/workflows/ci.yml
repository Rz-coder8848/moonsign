name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (fmt + check + interface)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-moonbit
      - name: Format check
        run: moon fmt --check
      - name: Type check (warnings are errors)
        run: moon check --deny-warn
      - name: Generated interface is committed
        run: |
          moon info
          git diff --exit-code

  test:
    name: test (${{ matrix.os }} / ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: native
          - os: ubuntu-latest
            target: wasm-gc
          - os: macos-latest
            target: native
          - os: windows-latest
            target: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-moonbit
      - name: Test
        run: moon test --target ${{ matrix.target }}

  interop:
    name: interop (OpenSSL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-moonbit
      - name: CMS built by MoonSign verifies with OpenSSL
        run: |
          moon run --target wasm-gc cmd/cmsprobe | grep '^HEX:' | cut -d: -f2 | xxd -r -p > cms.der
          openssl cms -verify -binary -inform DER -in cms.der \
            -content testdata/certs/message.bin -noverify -out /dev/null
      - name: PDF signature built by MoonSign verifies with OpenSSL
        run: |
          moon run --target wasm-gc cmd/signprobe | grep '^PDF:' | cut -d: -f2 | xxd -r -p > signed.pdf
          python3 scripts/verify_pdf_signature.py signed.pdf

  cli:
    name: cli smoke (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-moonbit
      - name: Create a blank PDF and a throwaway certificate
        run: |
          moon run cmd/mkpdf -- blank.pdf
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem \
            -days 365 -nodes -subj "/CN=MoonSign CI"
      - name: Sign, verify and inspect
        run: |
          moon run cmd/moonsign -- sign blank.pdf --out signed.pdf --key key.pem --cert cert.pem
          moon run cmd/moonsign -- verify signed.pdf --cert cert.pem
          moon run cmd/moonsign -- info signed.pdf
          moon run cmd/moonsign -- sign blank.pdf --out signed-json.pdf --key key.pem --cert cert.pem --json
          python3 scripts/verify_pdf_signature.py signed.pdf
      - name: Visible signature
        run: |
          moon run cmd/moonsign -- sign blank.pdf --out visible.pdf --key key.pem \
            --cert cert.pem --visible --appearance-text "Digitally signed by CI"
          moon run cmd/moonsign -- verify visible.pdf --cert cert.pem
      - name: Sign with a PKCS#12 file
        run: |
          moon run cmd/moonsign -- sign blank.pdf --out p12-signed.pdf \
            --p12 testdata/certs/rsa.p12 --p12-password test
          moon run cmd/moonsign -- verify p12-signed.pdf --cert testdata/certs/rsa.crt
      - name: Certificate chain trust
        run: |
          cat testdata/certs/int.crt testdata/certs/ca.crt > chain.pem
          moon run cmd/moonsign -- sign blank.pdf --out chain-signed.pdf \
            --key testdata/certs/leaf.key --cert testdata/certs/leaf.crt --chain chain.pem
          moon run cmd/moonsign -- verify chain-signed.pdf --anchors testdata/certs/ca.crt
          set +e
          moon run cmd/moonsign -- verify chain-signed.pdf --anchors testdata/certs/rsa.crt
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "expected exit 3 (valid but untrusted), got $code"
            exit 1
          fi
          moon run cmd/moonsign -- verify chain-signed.pdf \
            --anchors testdata/certs/ca.crt --ocsp testdata/certs/ocsp-good.der | tee ocsp.txt
          grep -q "OCSP: good" ocsp.txt
          set +e
          moon run cmd/moonsign -- verify chain-signed.pdf \
            --anchors testdata/certs/ca.crt --ocsp testdata/certs/ocsp-revoked.der
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "expected exit 3 (revoked), got $code"
            exit 1
          fi
          set +e
          moon run cmd/moonsign -- verify chain-signed.pdf \
            --anchors testdata/certs/ca.crt --crl testdata/certs/crl.pem
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "expected exit 3 (revoked), got $code"
            exit 1
          fi
      - name: RFC 3161 timestamp (OpenSSL TSA)
        run: |
          moon run cmd/moonsign -- sign blank.pdf --out ts-base.pdf \
            --key key.pem --cert cert.pem --signing-time 1793793600
          moon run cmd/moonsign -- tsa-request ts-base.pdf --out req.der
          openssl ts -query -in req.der -text > query.txt
          head -12 query.txt
          cat > tsa.cnf <<'EOF'
          [tsa]
          default_tsa = tsa_config1
          [tsa_config1]
          serial = tsa_serial
          crypto_device = builtin
          signer_cert = tsa.crt
          signer_key = tsa.key
          signer_digest = sha256
          default_policy = 1.2.3.4.1
          digests = sha256
          accuracy = secs:1
          ordering = yes
          tsa_name = yes
          ess_cert_id_chain = no
          EOF
          openssl req -x509 -newkey rsa:2048 -keyout tsa.key -out tsa.crt \
            -days 365 -nodes -subj "/CN=MoonSign Test TSA" \
            -addext "extendedKeyUsage=critical,timeStamping" \
            -addext "keyUsage=critical,digitalSignature"
          echo 01 > tsa_serial
          openssl ts -reply -config tsa.cnf -queryfile req.der -out resp.der
          moon run cmd/moonsign -- tsa-embed ts-base.pdf --response resp.der --out stamped.pdf --anchors tsa.crt
          moon run cmd/moonsign -- verify stamped.pdf --cert cert.pem --tsa-anchors tsa.crt | tee verify.txt
          grep -q "timestamp: VALID and TRUSTED" verify.txt
      - name: Run the example
        run: bash examples/sign-and-verify/run.sh

  bench:
    name: benchmark (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-moonbit
      - name: Sign and verify increasing PDF sizes
        run: moon run --release cmd/bench | tee bench.txt
  pyhanko:
    name: interop (pyHanko)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-moonbit
      - name: Install pyHanko
        run: python3 -m pip install --quiet pyhanko
      - name: pyHanko validates a MoonSign signature
        run: |
          moon run cmd/mkpdf -- blank.pdf
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem \
            -days 365 -nodes -subj "/CN=MoonSign CI"
          moon run cmd/moonsign -- sign blank.pdf --out signed.pdf --key key.pem --cert cert.pem
          python3 scripts/pyhanko_check.py validate signed.pdf
      - name: Sign a PDF with pyHanko
        run: |
          moon run cmd/mkpdf -- blank-form.pdf --with-field
          python3 scripts/pyhanko_check.py sign blank-form.pdf pyhanko-signed.pdf key.pem cert.pem
      - name: MoonSign verifies a pyHanko signature
        run: moon run cmd/moonsign -- verify pyhanko-signed.pdf --cert cert.pem